name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # SHA dikunci (diverifikasi dari halaman rilis dan halaman commit di github.com saat audit, Nov 2026); Dependabot memperbaruinya.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npx prettier --check .
      - run: npm run build:single
      - name: Audit dependensi produksi (gagal bila ada temuan high/critical)
        run: npm audit --omit=dev --audit-level=high
      - name: SBOM CycloneDX
        run: npm sbom --sbom-format cyclonedx > sbom.cdx.json
      - name: Pastikan build tidak memanggil sumber daya eksternal
        run: |
          if grep -E -o 'src="https?://[^"]+"|href="https?://[^"]+"' dist-single/index.html; then
            echo "Ditemukan referensi eksternal pada dist-single/index.html" && exit 1
          fi
