name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    name: Format, lint, dan uji (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # SHA dikunci (v7.0.1); Dependabot memperbaruinya.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Pustaka sistem (WebView/GTK)
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libxdo-dev libayatana-appindicator3-dev libssl-dev
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - name: Pemformat ketikan kalkulator (JS identik dengan Rust)
        run: node tests/ui/kalkulator-ketik.cjs

  windows:
    name: Bangun aplikasi dan pemasang (Windows)
    needs: linux
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Bangun dekri-lab.exe dan pemasang NSIS
        shell: pwsh
        run: ./installer/build.ps1
      - name: Pastikan hasil build ada
        shell: pwsh
        run: |
          $setup = Get-ChildItem dist/DEKRi-Lab-Setup-*.exe
          if (-not $setup) { throw 'Pemasang tidak terbentuk' }
          $setup | ForEach-Object { "{0}  {1:N1} MB" -f $_.Name, ($_.Length / 1MB) }
