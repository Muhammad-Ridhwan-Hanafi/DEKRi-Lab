name: Release (Windows)

# Dipicu oleh tag versi, misalnya: git tag v2.0.0 && git push origin v2.0.0
# Hanya pemilik repositori yang sebaiknya bisa membuat tag (atur lewat tag ruleset; lihat docs/GITHUB_SETUP.md).
on:
  push:
    tags: ['v*']

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: write # hanya untuk membuat GitHub Release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Pastikan tag cocok dengan versi di Cargo.toml
        shell: bash
        run: |
          v="$(grep -m1 '^version' Cargo.toml | sed -E 's/version *= *"([^"]+)"/\1/')"
          if [ "$GITHUB_REF_NAME" != "v$v" ]; then
            echo "Tag $GITHUB_REF_NAME tidak sama dengan v$v di Cargo.toml" && exit 1
          fi
      - name: Uji
        run: cargo test --workspace --locked --release
      - name: Bangun aplikasi, pemasang NSIS, dan versi tanpa pemasangan
        shell: pwsh
        run: ./installer/build.ps1
      - name: Checksum SHA-256
        shell: pwsh
        run: |
          $files = @(Get-Item "dist/DEKRi-Lab-Setup-*.exe") + @(Get-Item "dist/DEKRi-Lab-windows-x64.zip")
          $files | ForEach-Object {
            $h = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$h  $($_.Name)"
          } | Out-File -Encoding ascii "dist/SHA256SUMS.txt"
      - name: Buat GitHub Release (draf, ditinjau pemilik sebelum dipublikasikan)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/DEKRi-Lab-Setup-*.exe dist/DEKRi-Lab-windows-x64.zip dist/SHA256SUMS.txt \
            --draft --prerelease --title "DEKRi Lab $GITHUB_REF_NAME" --notes-file .github/release-notes-header.md --generate-notes
